version: "0.1.0"
description: Virtual esp_lcd panel powered by SDL, for simulating a display on the host
url: https://github.com/espressif/idf-extra-components/tree/master/esp_lcd_host
repository: https://github.com/espressif/idf-extra-components.git
issues: https://github.com/espressif/idf-extra-components/issues
# The component is a host (Linux) simulation only: the panel renders through the
# SDL that is vendored in the component, and it builds for the POSIX target.
# Restrict the component to that target so the dependency solver rejects it for
# real chips instead of failing later in the build.
targets:
  - linux

dependencies:
  idf: ">=6.0.0"
