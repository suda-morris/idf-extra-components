version: "0.1.0"
description: Virtual esp_lcd panel powered by SDL, for simulating a display on the host
url: https://github.com/espressif/idf-extra-components/tree/master/esp_lcd_host
repository: https://github.com/espressif/idf-extra-components.git
issues: https://github.com/espressif/idf-extra-components/issues
# The component is a host simulation only: the panel renders through the SDL
# that is vendored in the component.
#
# "linux" is the name of the ESP-IDF host target. It is the same name on the
# Linux and macOS hosts that the target supports; it does not mean that the
# component needs the Linux kernel.
# Restrict the component to that target so the dependency solver rejects it for
# real chips instead of failing later in the build.
targets:
  - linux

dependencies:
  idf: ">=6.0.0"
  # esp_lcd_host_screenshot_save_png() encodes through libpng (png_write_row).
  espressif/libpng: "^1.6.58"
