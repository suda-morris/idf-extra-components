version: "0.1.0"
description: Virtual esp_lcd panel powered by SDL, for simulating a display on the host
url: https://github.com/espressif/idf-extra-components/tree/master/esp_lcd_host
repository: https://github.com/espressif/idf-extra-components.git
issues: https://github.com/espressif/idf-extra-components/issues
dependencies:
  idf: ">=6.0.0"
  # The panel simulator passes every frame to SDL, so the component needs the SDL
  # video and software renderer support. On chip targets the simulator runs as a
  # separate process and the panel is a local stand-in, so SDL is not pulled in.
  georgik/sdl:
    version: "^3.3.7~3"
    public: true
    matches:
      - if: target == "linux"
  espressif/libpng:
    version: "^1.6.58"
    public: false
    matches:
      - if: target == "linux"
