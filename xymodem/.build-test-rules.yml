xymodem/test_apps:
  enable:
    - if: IDF_TARGET in ["esp32c5", "esp32s31"]
      reason: "RISC-V reference targets for the Rust engine"
  disable:
    - if: IDF_VERSION_MAJOR < 6 or (IDF_VERSION_MAJOR == 6 and IDF_VERSION_MINOR < 1)
      reason: ESP32-S31 is available since IDF v6.1

xymodem/examples/xymodem_event:
  enable:
    - if: IDF_TARGET in ["esp32c5"]
      reason: "RISC-V reference targets for the Rust engine"

xymodem/examples/xymodem_ota:
  enable:
    - if: IDF_TARGET in ["esp32c5"]
      reason: "UHCI-capable reference target for the Rust engine"
