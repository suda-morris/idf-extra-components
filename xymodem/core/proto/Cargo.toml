[package]
name = "xymodem_proto"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "sans-IO, no_std XMODEM protocol state machine"

[lints]
workspace = true

[lib]
# A plain rlib: this is what makes `cargo test` possible. Corrosion overrides
# the crate-type of `ffi` (which depends on this crate), not of `proto`.
crate-type = ["rlib"]
