# SPDX-FileCopyrightText: 2026 Espressif Systems (Shanghai) CO LTD
# SPDX-License-Identifier: Apache-2.0
# Generates `include/xymodem_core.h` from `ffi/src/lib.rs`.
#
# The header in `include/` is a checked-in SNAPSHOT for readers without a Rust
# toolchain. It is regenerated by the `xymodem-cbindgen-header` pre-commit
# hook (`tools/update_header.sh`). A normal build NEVER writes into the
# source tree (see build.rs), so building cannot dirty a user's git checkout.
language = "C"
# Prepended verbatim to the generated header, so the checked-in snapshot and
# the CMake build output both carry the repository's license tag.
header = """/* SPDX-FileCopyrightText: 2026 Espressif Systems (Shanghai) CO LTD
 * SPDX-License-Identifier: Apache-2.0
 *
 * AUTO-GENERATED by cbindgen from core/ffi/src/lib.rs. DO NOT EDIT BY HAND.
 * Regenerated by the xymodem-cbindgen-header pre-commit hook
 * (core/tools/update_header.sh). A normal build only writes this file into
 * the build directory.
 */"""

include_guard = "XYMODEM_CORE_H"
pragma_once = true
cpp_compat = true
style = "both"

# cbindgen otherwise injects <stdarg.h>/<stdlib.h> for nothing. The ABI only
# needs bool, fixed-width ints and size_t.
no_includes = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
usize_is_size_t = true

documentation = true
documentation_style = "c99"
# "full" keeps whole doc comments; the default "short" silently truncates each
# at the first period and throws away the ownership/parameter notes.
documentation_length = "full"
include_version = false

[export]
# Constants become #defines so their values live in exactly one place (Rust).
# `parse_deps = false` (below) keeps proto's internal types out of the header,
# so no type blacklist is needed. `abort` is the one exception: it is a private
# libc declaration used only by our panic handler, not part of this ABI (and
# exporting it would clash with <stdlib.h>).
#
# `XymodemCheckMode` is stored as `uint8_t` in `XymodemCoreConfig` so a garbage
# value can still be rejected at init; cbindgen would otherwise drop the enum
# because it never appears as a field or return type. Force-export it so C
# callers get `XYMODEM_CHECK_AUTO` / `SUM8` / `CRC16`.
item_types = ["constants", "enums", "structs", "functions"]
include = ["XymodemCheckMode"]
exclude = ["abort"]

[export.rename]
XymodemCore = "xymodem_core_t"
XymodemCoreIo = "xymodem_core_io_t"
XymodemCoreConfig = "xymodem_core_config_t"
XymodemFileInfo = "xymodem_core_file_info_t"
XymodemErr = "xymodem_err_t"
XymodemCheckMode = "xymodem_check_mode_t"
XymodemStatus = "xymodem_status_t"
XymodemEvent = "xymodem_event_t"
XymodemRole = "xymodem_role_t"

[enum]
prefix_with_name = false
rename_variants = "None"

[fn]
# cbindgen emits `extern "C" fn` typedefs for callback fields; keep them terse.
args = "auto"

[parse]
# The entire C ABI lives in ffi/src/lib.rs; do not parse the proto crate.
parse_deps = false
